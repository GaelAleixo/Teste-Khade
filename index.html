<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caçador de Formas AR</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* O vídeo fica escondido, usamos apenas para captar a imagem */
        #videoElement { display: none; }
        
        /* O canvas é onde desenhamos o vídeo com os gráficos do OpenCV por cima */
        #canvasOutput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 10;
        }

        /* Interface do Usuário (HUD) que fica por cima do vídeo */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* Deixa os cliques passarem para botões específicos */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Retícula (mira no centro da tela) */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: rgba(255,0,0,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Botão de captura animado */
        .catch-btn {
            pointer-events: auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4b4b 50%, #cc0000 100%);
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .catch-btn:active { transform: scale(0.9); }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Notificação flutuante */
        #notification {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento -->
    <div id="loading" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h1 class="text-2xl font-bold text-white mb-2">Caçador de Formas</h1>
        <p id="loading-text" class="text-gray-400 text-center px-4">Carregando IA de Visão Computacional (OpenCV)...<br><small>Isso pode levar alguns segundos na primeira vez.</small></p>
    </div>

    <!-- Elementos Multimídia -->
    <video id="videoElement" playsinline autoplay muted></video>
    <canvas id="canvasOutput"></canvas>

    <!-- Notificação central -->
    <div id="notification">Capturado!</div>

    <!-- Interface do Jogo (HUD) -->
    <div id="ui-layer" class="hidden">
        
        <!-- Topo: Inventário e Status -->
        <div class="p-4 flex justify-between items-start">
            <div class="glass-panel rounded-xl p-3">
                <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wider mb-2">Sua Mochila</h2>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-6 h-6 bg-red-500 clip-triangle mb-1" style="clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
                        <span id="count-triangulo" class="font-bold">0</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-6 h-6 bg-blue-500 mb-1"></div>
                        <span id="count-quadrado" class="font-bold">0</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-5 bg-purple-500 mb-1 mt-1"></div>
                        <span id="count-retangulo" class="font-bold">0</span>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel rounded-xl p-2 text-xs flex flex-col items-end">
                <span id="fps-counter" class="text-green-400 font-mono">FPS: --</span>
                <span class="text-gray-400 mt-1">Detectando: <span id="current-detect-status" class="text-white">Nenhum</span></span>
            </div>
        </div>

        <!-- Centro: Mira -->
        <div class="crosshair"></div>

        <!-- Base: Controles -->
        <div class="p-6 flex justify-center pb-10">
            <button id="catchBtn" class="catch-btn text-white shadow-xl shadow-red-900/50 focus:outline-none">
                Pegar!
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Variáveis Globais de Estado
        let isCvLoaded = false;
        let isVideoPlaying = false;
        let streaming = false;
        
        // Memória do OpenCV
        let src, gray, blur, edges, contours, hierarchy;
        let cap;
        
        // Estado do Jogo
        let inventory = { "Triângulo": 0, "Quadrado": 0, "Retângulo": 0, "Polígono": 0 };
        let currentlyDetectedShapes = [];
        let lastDetectionTime = 0; // Novo: Para evitar falhas quando a deteção "pisca"
        let lastTime = Date.now();
        let frames = 0;

        // Elementos DOM
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasOutput');
        const uiLayer = document.getElementById('ui-layer');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const catchBtn = document.getElementById('catchBtn');
        const notification = document.getElementById('notification');

        // Função chamada quando a página carrega
        window.onload = function() {
            // Inicia o carregamento assíncrono do OpenCV.js
            const script = document.createElement('script');
            script.src = "https://docs.opencv.org/4.8.0/opencv.js";
            script.async = true;
            script.onload = () => {
                // O script carregou, mas a WASM interna do OpenCV pode demorar mais um pouco
                checkOpenCVReady();
            };
            script.onerror = () => {
                loadingText.innerHTML = "Erro ao carregar OpenCV. Verifique sua conexão.";
            };
            document.body.appendChild(script);
        };

        function checkOpenCVReady() {
            if (typeof cv !== 'undefined' && cv.Mat) {
                isCvLoaded = true;
                loadingText.innerText = "Acessando Câmera...";
                initCamera();
            } else {
                setTimeout(checkOpenCVReady, 100);
            }
        }

        // Inicia a câmera do dispositivo (preferencialmente a traseira)
        function initCamera() {
            const constraints = {
                video: { 
                    facingMode: "environment", // Tenta forçar a câmera traseira
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                })
                .catch(function(err) {
                    console.error("Erro ao acessar câmera: ", err);
                    loadingText.innerHTML = "Erro ao acessar a câmera.<br>Por favor, dê permissão.";
                });

            // Aguarda o vídeo começar a tocar para configurar o tamanho do Canvas
            video.addEventListener('canplay', function() {
                if (!isVideoPlaying) {
                    isVideoPlaying = true;
                    // Define dimensões reais
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Prepara OpenCV e inicia o loop
                    initOpenCVMemory();
                    loading.classList.add('hidden');
                    uiLayer.classList.remove('hidden');
                    streaming = true;
                    requestAnimationFrame(processVideo);
                }
            });
        }

        function initOpenCVMemory() {
            src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
            gray = new cv.Mat();
            blur = new cv.Mat();
            edges = new cv.Mat();
            contours = new cv.MatVector();
            hierarchy = new cv.Mat();
            cap = new cv.VideoCapture(video);
        }

        // Loop principal de processamento de imagem
        function processVideo() {
            if (!streaming) return;

            try {
                // Lê o quadro atual da câmera
                cap.read(src);

                // 1. Converte para Tons de Cinza
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                
                // 2. Desfoca levemente para reduzir ruído (sujeira na imagem)
                cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                
                // 3. Detecta bordas (Algoritmo Canny - Ajustado para ser mais tolerante)
                cv.Canny(blur, edges, 30, 100, 3, false);
                
                // 4. Encontra contornos contínuos nas bordas
                cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let tempDetected = [];

                // 5. Analisa cada contorno encontrado
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    
                    // Filtra formas muito pequenas (ruído) ou enormes (a tela inteira)
                    if (area > 1500 && area < (video.width * video.height * 0.8)) {
                        let perimeter = cv.arcLength(cnt, true);
                        let approx = new cv.Mat();
                        
                        // Tenta aproximar o contorno redondo/irregular para um polígono de retas
                        cv.approxPolyDP(cnt, approx, 0.04 * perimeter, true);

                        let vertices = approx.rows;
                        let shapeName = "";
                        let color;

                        // Classifica a forma baseada no número de vértices (cantos)
                        if (vertices === 3) {
                            shapeName = "Triângulo";
                            color = new cv.Scalar(255, 0, 0, 255); // Vermelho no OpenCV (BGR)
                        } else if (vertices === 4) {
                            // É 4 lados. Mas é quadrado ou retângulo?
                            let rect = cv.boundingRect(approx);
                            let aspectRatio = rect.width / rect.height;
                            if (aspectRatio >= 0.85 && aspectRatio <= 1.15) {
                                shapeName = "Quadrado";
                                color = new cv.Scalar(0, 200, 255, 255); // Amarelo
                            } else {
                                shapeName = "Retângulo";
                                color = new cv.Scalar(255, 0, 255, 255); // Roxo
                            }
                        }

                        if (shapeName !== "") {
                            tempDetected.push(shapeName);
                            
                            // Desenha o contorno detectado na tela
                            let tmpContours = new cv.MatVector();
                            tmpContours.push(approx);
                            cv.drawContours(src, tmpContours, 0, color, 3, cv.LINE_8, hierarchy, 0);
                            
                            // Escreve o nome da forma
                            let moments = cv.moments(cnt, false);
                            let cx = moments.m10 / moments.m00;
                            let cy = moments.m01 / moments.m00;
                            cv.putText(src, shapeName, new cv.Point(cx - 30, cy), cv.FONT_HERSHEY_SIMPLEX, 0.7, color, 2, cv.LINE_AA);
                            
                            tmpContours.delete();
                        }
                        approx.delete();
                    }
                    cnt.delete(); // Previne vazamento de memória
                }

                // Atualiza estado global com um pequeno "período de tolerância"
                if (tempDetected.length > 0) {
                    currentlyDetectedShapes = tempDetected;
                    lastDetectionTime = Date.now();
                    document.getElementById('current-detect-status').innerText = tempDetected.join(", ");
                } else if (Date.now() - lastDetectionTime > 500) {
                    // Só esvazia se passar 500ms sem detetar nada (evita o piscar)
                    currentlyDetectedShapes = [];
                    document.getElementById('current-detect-status').innerText = "Nenhum";
                }

                // Mostra a imagem processada no Canvas HTML
                cv.imshow('canvasOutput', src);

                // Cálculo de FPS
                frames++;
                let now = Date.now();
                if (now - lastTime >= 1000) {
                    document.getElementById('fps-counter').innerText = `FPS: ${frames}`;
                    frames = 0;
                    lastTime = now;
                }

                // Solicita próximo frame ao navegador
                requestAnimationFrame(processVideo);

            } catch (err) {
                console.error("Erro no processamento do vídeo: ", err);
                // Continua tentando mesmo se um frame falhar
                requestAnimationFrame(processVideo);
            }
        }

        // Lógica de Captura (O Botão "Pegar!")
        catchBtn.addEventListener('click', () => {
            if (currentlyDetectedShapes.length > 0) {
                // Adiciona ao inventário
                let captureText = [];
                currentlyDetectedShapes.forEach(shape => {
                    if (inventory[shape] !== undefined) {
                        inventory[shape]++;
                        captureText.push(shape);
                    }
                });

                // Atualiza UI da mochila
                document.getElementById('count-triangulo').innerText = inventory["Triângulo"];
                document.getElementById('count-quadrado').innerText = inventory["Quadrado"];
                document.getElementById('count-retangulo').innerText = inventory["Retângulo"];

                // Mostra notificação de sucesso
                showNotification(`Pegou: ${captureText.join(", ")}!`, "rgba(76, 175, 80, 0.9)");
                
                // Feedback visual e tátil (vibração se o celular suportar)
                if (navigator.vibrate) navigator.vibrate(100);
                
            } else {
                // Errou
                showNotification("A mira está vazia...", "rgba(244, 67, 54, 0.9)");
            }
        });

        function showNotification(text, bgColor) {
            notification.innerText = text;
            notification.style.background = bgColor;
            notification.style.opacity = '1';
            
            setTimeout(() => {
                notification.style.opacity = '0';
            }, 1500);
        }

        // Limpeza de memória se o usuário fechar a página
        window.onunload = function() {
            if (src) src.delete();
            if (gray) gray.delete();
            if (blur) blur.delete();
            if (edges) edges.delete();
            if (contours) contours.delete();
            if (hierarchy) hierarchy.delete();
        };

    </script>
</body>
</html>
