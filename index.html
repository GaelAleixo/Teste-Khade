<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Hunter GO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* O vídeo real fica escondido, usaremos o canvas para exibir e processar */
        video {
            display: none;
        }

        /* Canvas de exibição principal */
        #display-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Animação de Scan */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 128, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 128, 1);
            animation: scan 3s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .hud-text {
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* Efeito de flash quando captura */
        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-out;
        }
    </style>
</head>
<body class="text-white">

    <div id="camera-container">
        <!-- Elementos de Mídia -->
        <video id="video" autoplay playsinline></video>
        <canvas id="display-canvas"></canvas>
        <canvas id="processing-canvas" style="display:none;"></canvas> <!-- Usado para análise rápida de pixels -->
        
        <div id="scan-line" class="scan-line"></div>
        <div id="flash"></div>

        <!-- HUD Superior -->
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-20 bg-gradient-to-b from-black/80 to-transparent">
            <div>
                <h1 class="text-xl font-bold text-green-400 hud-text tracking-wider">PATTERN HUNTER</h1>
                <p id="status-text" class="text-xs text-yellow-300 hud-text">Iniciando Câmera...</p>
            </div>
            <div class="w-12 h-12 bg-green-500/20 border-2 border-green-400 rounded-full flex items-center justify-center animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </div>
        </div>

        <!-- Alerta Central de Captura -->
        <div id="capture-alert" class="absolute inset-0 flex items-center justify-center z-30 hidden">
            <div class="bg-black/80 border-4 border-green-500 p-6 rounded-xl text-center transform scale-110 transition-transform duration-300">
                <h2 class="text-3xl font-black text-green-400 mb-2">CAPTURADO!</h2>
                <p id="capture-type" class="text-lg text-white font-bold">Padrão de 4 Pontos</p>
                <div class="mt-4 text-sm text-gray-400">Dados salvos no inventário</div>
            </div>
        </div>

        <!-- Inventário (Pokedex de Padrões) -->
        <div class="absolute bottom-0 left-0 w-full p-6 z-20 bg-gradient-to-t from-black via-black/80 to-transparent pb-10">
            <h3 class="text-xs text-gray-400 mb-3 text-center uppercase tracking-widest">Seu Inventário</h3>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-blue-900/40 border border-blue-500 p-3 rounded-lg backdrop-blur-sm">
                    <div class="text-blue-400 text-sm mb-1 font-bold">3 PONTOS</div>
                    <div id="count-3" class="text-2xl font-black">0</div>
                </div>
                <div class="bg-purple-900/40 border border-purple-500 p-3 rounded-lg backdrop-blur-sm">
                    <div class="text-purple-400 text-sm mb-1 font-bold">4 PONTOS</div>
                    <div id="count-4" class="text-2xl font-black">0</div>
                </div>
                <div class="bg-pink-900/40 border border-pink-500 p-3 rounded-lg backdrop-blur-sm">
                    <div class="text-pink-400 text-sm mb-1 font-bold">6 PONTOS</div>
                    <div id="count-6" class="text-2xl font-black">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configurações e Estado da Aplicação
        const STATE = {
            inventory: { 3: 0, 4: 0, 6: 0 },
            isCapturing: false,
            stableFrames: 0,
            targetPattern: null
        };

        const CONFIG = {
            processWidth: 160,  // Resolução reduzida para processamento rápido (Performance!)
            processHeight: 120,
            framesToCapture: 15, // Quantos frames seguidos o padrão deve ser visto para capturar
            cooldownMs: 3000     // Tempo de espera entre capturas
        };

        // Elementos da DOM
        const video = document.getElementById('video');
        const displayCanvas = document.getElementById('display-canvas');
        const displayCtx = displayCanvas.getContext('2d');
        const processCanvas = document.getElementById('processing-canvas');
        const processCtx = processCanvas.getContext('2d');
        const statusText = document.getElementById('status-text');

        // Inicializa a resolução interna de processamento
        processCanvas.width = CONFIG.processWidth;
        processCanvas.height = CONFIG.processHeight;

        // Função de Inicialização da Câmera (Back camera)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Usa a câmera traseira do M52
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);
                    statusText.innerText = "Buscando Padrões...";
                    statusText.className = "text-xs text-green-300 hud-text";
                    requestAnimationFrame(gameLoop);
                };
            } catch (err) {
                console.error("Erro ao acessar a câmera:", err);
                statusText.innerText = "Erro de Câmera. Dê permissão.";
                statusText.className = "text-xs text-red-500 hud-text";
                alert("Por favor, permita o acesso à câmera para usar o app.");
            }
        }

        // Ajusta o canvas de exibição para preencher a tela
        function resizeCanvas() {
            displayCanvas.width = window.innerWidth;
            displayCanvas.height = window.innerHeight;
        }

        // Algoritmo Customizado de Visão Computacional
        function detectBlueDots(imageData) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const dots = [];
            const thresholdDistance = 25; // Distância máx para considerar pixels como o mesmo ponto

            // Percorre os pixels pulando de 2 em 2 para máxima performance em mobiles
            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const i = (y * width + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Heurística para detecção de cor AZUL ESCURO (tinta de caneta/piloto)
                    // Azul deve ser dominante em relação ao vermelho e verde.
                    if (b > r + 20 && b > g + 20 && b > 40 && r < 180 && g < 180) {
                        
                        let addedToExisting = false;
                        
                        // Tenta agrupar este pixel azul a um ponto (blob) já existente
                        for (let dot of dots) {
                            const cx = dot.sumX / dot.count;
                            const cy = dot.sumY / dot.count;
                            const dist = Math.hypot(cx - x, cy - y);
                            
                            if (dist < thresholdDistance) {
                                dot.sumX += x;
                                dot.sumY += y;
                                dot.count++;
                                dot.minX = Math.min(dot.minX, x);
                                dot.maxX = Math.max(dot.maxX, x);
                                dot.minY = Math.min(dot.minY, y);
                                dot.maxY = Math.max(dot.maxY, y);
                                addedToExisting = true;
                                break;
                            }
                        }

                        // Se não encontrou grupo próximo, cria um novo
                        if (!addedToExisting) {
                            dots.push({
                                sumX: x, sumY: y, count: 1,
                                minX: x, maxX: x, minY: y, maxY: y
                            });
                        }
                    }
                }
            }

            // Filtra pontos válidos (remove ruídos muito pequenos ou muito grandes)
            // Transforma os dados em coordenadas simplificadas
            return dots
                .filter(d => d.count > 4 && d.count < 400) 
                .map(d => ({
                    x: d.sumX / d.count,
                    y: d.sumY / d.count,
                    radius: Math.max((d.maxX - d.minX), (d.maxY - d.minY)) / 2 + 2
                }));
        }

        // Agrupa os pontos encontrados baseados na proximidade para identificar padrões
        function findPatterns(dots) {
            if (dots.length < 3) return null;

            // Agrupa todos os pontos que estão a uma distância razoável (fazem parte da mesma figura)
            const maxGroupDistance = 80; // Distância máx entre pontos do mesmo padrão
            let groups = [];

            dots.forEach(dot => {
                let added = false;
                for (let group of groups) {
                    // Verifica se o ponto está próximo de qualquer ponto do grupo
                    for (let gDot of group) {
                        if (Math.hypot(dot.x - gDot.x, dot.y - gDot.y) < maxGroupDistance) {
                            group.push(dot);
                            added = true;
                            break;
                        }
                    }
                    if (added) break;
                }
                if (!added) groups.push([dot]);
            });

            // Procurar pelo primeiro grupo que tenha 3, 4 ou 6 pontos
            for (let group of groups) {
                if (group.length === 3 || group.length === 4 || group.length === 6) {
                    return {
                        type: group.length,
                        dots: group
                    };
                }
            }
            return null;
        }

        // Loop principal do "Jogo"
        function gameLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                
                // 1. Desenha o frame do vídeo na tela do usuário preenchendo tudo (estilo AR)
                // Calcula escala para cortar/centralizar o vídeo (object-fit: cover logic)
                const vRatio = video.videoWidth / video.videoHeight;
                const cRatio = displayCanvas.width / displayCanvas.height;
                let drawWidth, drawHeight, startX, startY;

                if (vRatio > cRatio) {
                    drawHeight = displayCanvas.height;
                    drawWidth = drawHeight * vRatio;
                    startX = (displayCanvas.width - drawWidth) / 2;
                    startY = 0;
                } else {
                    drawWidth = displayCanvas.width;
                    drawHeight = drawWidth / vRatio;
                    startX = 0;
                    startY = (displayCanvas.height - drawHeight) / 2;
                }
                
                displayCtx.drawImage(video, startX, startY, drawWidth, drawHeight);

                // 2. Extrai um frame em baixa resolução para processamento rápido
                processCtx.drawImage(video, 0, 0, CONFIG.processWidth, CONFIG.processHeight);
                const imageData = processCtx.getImageData(0, 0, CONFIG.processWidth, CONFIG.processHeight);

                // 3. Processamento de Imagem
                if (!STATE.isCapturing) {
                    const dots = detectBlueDots(imageData);
                    const pattern = findPatterns(dots);

                    // Escala para desenhar a interface de alvo na tela original
                    const scaleX = drawWidth / CONFIG.processWidth;
                    const scaleY = drawHeight / CONFIG.processHeight;

                    // Desenha HUD nos pontos encontrados
                    dots.forEach(dot => {
                        const finalX = startX + (dot.x * scaleX);
                        const finalY = startY + (dot.y * scaleY);
                        
                        displayCtx.beginPath();
                        displayCtx.arc(finalX, finalY, dot.radius * scaleX, 0, 2 * Math.PI);
                        displayCtx.lineWidth = 2;
                        displayCtx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                        displayCtx.stroke();
                    });

                    // Lógica de Captura
                    if (pattern) {
                        STATE.stableFrames++;
                        statusText.innerText = `Traçando padrão de ${pattern.type}...`;
                        statusText.className = "text-xs text-yellow-400 hud-text";

                        // Desenha as linhas conectando o padrão
                        displayCtx.beginPath();
                        pattern.dots.forEach((dot, index) => {
                            const finalX = startX + (dot.x * scaleX);
                            const finalY = startY + (dot.y * scaleY);
                            if (index === 0) displayCtx.moveTo(finalX, finalY);
                            else displayCtx.lineTo(finalX, finalY);
                            
                            // Caixa de alvo
                            displayCtx.strokeRect(finalX - 15, finalY - 15, 30, 30);
                        });
                        displayCtx.closePath();
                        
                        // Cor baseada no tipo
                        if(pattern.type === 3) displayCtx.strokeStyle = '#3b82f6'; // Azul
                        if(pattern.type === 4) displayCtx.strokeStyle = '#a855f7'; // Roxo
                        if(pattern.type === 6) displayCtx.strokeStyle = '#ec4899'; // Rosa
                        
                        displayCtx.lineWidth = 3;
                        displayCtx.stroke();

                        if (STATE.stableFrames >= CONFIG.framesToCapture) {
                            capturePattern(pattern.type);
                        }
                    } else {
                        STATE.stableFrames = 0;
                        statusText.innerText = "Buscando Padrões...";
                        statusText.className = "text-xs text-green-300 hud-text";
                    }
                }
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Ação de Capturar o Padrão
        function capturePattern(type) {
            STATE.isCapturing = true;
            STATE.inventory[type]++;
            
            // Atualiza Inventário Visual
            document.getElementById(`count-${type}`).innerText = STATE.inventory[type];
            document.getElementById('count-'+type).parentElement.classList.add('animate-pulse');
            setTimeout(() => document.getElementById('count-'+type).parentElement.classList.remove('animate-pulse'), 1000);

            // Tenta vibrar o celular (Feedback tátil premium)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }

            // Animação de Flash da Câmera
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            // Mostra o Alerta
            const alertBox = document.getElementById('capture-alert');
            const alertText = document.getElementById('capture-type');
            alertText.innerText = `Padrão de ${type} Pontos`;
            
            if(type === 3) alertText.className = "text-lg font-bold text-blue-400";
            if(type === 4) alertText.className = "text-lg font-bold text-purple-400";
            if(type === 6) alertText.className = "text-lg font-bold text-pink-400";

            alertBox.classList.remove('hidden');

            // Cooldown antes de buscar novamente
            setTimeout(() => {
                alertBox.classList.add('hidden');
                STATE.isCapturing = false;
                STATE.stableFrames = 0;
            }, CONFIG.cooldownMs);
        }

        // Inicia a aplicação
        startCamera();
    </script>
</body>
</html>
