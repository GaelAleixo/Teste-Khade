<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khade - Localizador de Objetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base para garantir acessibilidade e evitar barras de rolagem */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #video-container { position: relative; width: 100%; height: 100%; }
        /* O vídeo fica escondido, usamos apenas para capturar os frames */
        #videoElement { display: none; }
        /* O canvas é onde desenhamos a imagem da câmera e as marcações (Realidade Aumentada) */
        #renderCanvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* Animação para feedback de objeto encontrado */
        @keyframes pulse-border {
            0% { border-color: rgba(74, 222, 128, 0.5); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { border-color: rgba(74, 222, 128, 1); box-shadow: 0 0 0 15px rgba(74, 222, 128, 0); }
            100% { border-color: rgba(74, 222, 128, 0.5); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        .found-alert { animation: pulse-border 1.5s infinite; }
    </style>
</head>
<body class="text-white">

    <!-- Tela Inicial -->
    <div id="startScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900 p-6 text-center">
        <div class="bg-white text-gray-900 p-4 rounded-full mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </div>
        <h1 class="text-4xl font-bold mb-2">Khade</h1>
        <p class="text-lg text-gray-400 mb-8 max-w-sm">Aponte a câmera para os padrões de bolinhas azuis para encontrar seus objetos.</p>
        
        <div class="bg-gray-800 rounded-xl p-4 mb-8 w-full max-w-sm text-left">
            <h2 class="font-semibold mb-3 border-b border-gray-700 pb-2">O que estamos procurando?</h2>
            <ul class="space-y-3">
                <li class="flex items-center"><span class="w-8 h-8 rounded bg-gray-700 flex items-center justify-center mr-3 font-bold">3</span> 🔵 Triângulo = <b class="ml-1">Chave</b></li>
                <li class="flex items-center"><span class="w-8 h-8 rounded bg-gray-700 flex items-center justify-center mr-3 font-bold">4</span> 🔵 Quadrado = <b class="ml-1">Controle da TV</b></li>
                <li class="flex items-center"><span class="w-8 h-8 rounded bg-gray-700 flex items-center justify-center mr-3 font-bold">6</span> 🔵 Retângulo = <b class="ml-1">Controle do Portão</b></li>
            </ul>
        </div>

        <button id="btnStart" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg transition-transform transform active:scale-95 w-full max-w-sm">
            Ligar Câmera e Iniciar
        </button>
    </div>

    <!-- Interface da Câmera -->
    <div id="video-container" class="hidden">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="renderCanvas"></canvas>
        
        <!-- Header HUD -->
        <div class="absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
            <h1 class="text-2xl font-bold text-center drop-shadow-md">Khade</h1>
        </div>

        <!-- Painel de Dicas (HUD Inferior) -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm pointer-events-none">
            <div id="statusPanel" class="bg-black/70 backdrop-blur-md border border-gray-600 rounded-2xl p-4 shadow-xl transition-all duration-300 text-center">
                <p id="statusText" class="text-gray-300 text-lg font-medium">Procurando padrões azuis...</p>
                <div class="flex justify-center space-x-2 mt-2 opacity-50">
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>

        <!-- Botão Voltar/Parar -->
        <button id="btnStop" class="absolute top-4 right-4 bg-red-600/80 p-3 rounded-full shadow-lg z-10 active:bg-red-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Áudio de feedback (opcional para acessibilidade) -->
    <!-- Como browsers bloqueiam áudio não engatilhado pelo usuário, o som só seria tocado após interação -->

    <script>
        const startScreen = document.getElementById('startScreen');
        const videoContainer = document.getElementById('video-container');
        const videoElement = document.getElementById('videoElement');
        const renderCanvas = document.getElementById('renderCanvas');
        const ctx = renderCanvas.getContext('2d', { willReadFrequently: true });
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusPanel = document.getElementById('statusPanel');
        const statusText = document.getElementById('statusText');

        let isRunning = false;
        let animationId = null;

        // Dicionário de Padrões e Objetos
        const objectDictionary = {
            3: { name: "Chave", color: "#3b82f6", icon: "🔑" }, // Azul
            4: { name: "Controle da TV", color: "#ef4444", icon: "📺" }, // Vermelho
            6: { name: "Controle do Portão", color: "#a855f7", icon: "🚪" } // Roxo
        };

        // Solicita permissão e inicia a câmera
        async function startCamera() {
            try {
                // Configuração para forçar a câmera traseira (environment) no celular
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                videoElement.play();

                // Aguardar o vídeo carregar os metadados para saber o tamanho real
                videoElement.onloadedmetadata = () => {
                    renderCanvas.width = videoElement.videoWidth;
                    renderCanvas.height = videoElement.videoHeight;
                    
                    startScreen.classList.add('hidden');
                    videoContainer.classList.remove('hidden');
                    isRunning = true;
                    
                    // Inicia o Loop de Visão Computacional
                    processVideo();
                };
            } catch (err) {
                console.error("Erro ao acessar a câmera: ", err);
                alert("Não foi possível acessar a câmera. Verifique as permissões no seu navegador Google Chrome.");
            }
        }

        // Para a câmera e volta à tela inicial
        function stopCamera() {
            isRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            
            const stream = videoElement.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }
            videoElement.srcObject = null;
            
            videoContainer.classList.add('hidden');
            startScreen.classList.remove('hidden');
            resetStatus();
        }

        function resetStatus() {
            statusPanel.classList.remove('border-green-500', 'found-alert', 'bg-green-900/80');
            statusPanel.classList.add('border-gray-600', 'bg-black/70');
            statusText.innerHTML = "Procurando padrões azuis...";
        }

        // Atualiza a UI quando um objeto é encontrado
        function updateStatus(foundObjects) {
            if (foundObjects.length > 0) {
                statusPanel.classList.remove('border-gray-600', 'bg-black/70');
                statusPanel.classList.add('border-green-500', 'found-alert', 'bg-green-900/90');
                
                // Pega o primeiro objeto encontrado para mostrar no painel
                const obj = foundObjects[0];
                statusText.innerHTML = `<span class="text-3xl">${obj.icon}</span><br><b class="text-xl text-white">Encontrado: ${obj.name}</b>`;
            } else {
                resetStatus();
            }
        }

        // Lógica Principal de Visão Computacional (Processamento de Imagem)
        function processVideo() {
            if (!isRunning) return;

            const w = renderCanvas.width;
            const h = renderCanvas.height;

            // 1. Desenha o frame do vídeo no canvas
            ctx.drawImage(videoElement, 0, 0, w, h);

            // 2. Extrai os pixels para análise
            const frameData = ctx.getImageData(0, 0, w, h);
            const data = frameData.data;

            // Configurações do Algoritmo
            const step = 4; // Analisa 1 pixel a cada 4 (aumenta a performance drasticamente no celular)
            let bluePixels = [];

            // 3. Varredura de Cores (Encontrar Azul da Caneta/Marcador)
            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const i = (y * w + x) * 4;
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];

                    // Heurística robusta para identificar "Tinta Azul" em papel/fundo claro
                    // O azul deve ser significativamente maior que o Vermelho e Verde
                    const maxRG = Math.max(r, g);
                    if (b - maxRG > 35 && b > 70) {
                        bluePixels.push({ x, y });
                    }
                }
            }

            // 4. Agrupar pixels próximos em "Bolinhas" (Clusters)
            let dots = [];
            const dotClusterRadius = 30; // Distância máx para pixels pertencerem a mesma bolinha

            for (let i = 0; i < bluePixels.length; i++) {
                let p = bluePixels[i];
                let found = false;

                for (let j = 0; j < dots.length; j++) {
                    let d = dots[j];
                    // Distância Euclidiana
                    let dist = Math.hypot(p.x - d.cx, p.y - d.cy);
                    if (dist < dotClusterRadius) {
                        // Atualiza a média do centroide
                        d.cx = ((d.cx * d.count) + p.x) / (d.count + 1);
                        d.cy = ((d.cy * d.count) + p.y) / (d.count + 1);
                        d.count++;
                        
                        // Atualiza a bounding box da bolinha
                        d.minX = Math.min(d.minX, p.x);
                        d.maxX = Math.max(d.maxX, p.x);
                        d.minY = Math.min(d.minY, p.y);
                        d.maxY = Math.max(d.maxY, p.y);
                        
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    dots.push({ 
                        cx: p.x, cy: p.y, count: 1, 
                        minX: p.x, maxX: p.x, minY: p.y, maxY: p.y 
                    });
                }
            }

            // Filtrar ruídos: Bolinhas precisam ter uma quantidade mínima de pixels detectados
            dots = dots.filter(d => d.count > 4);

            // Opcional: Desenhar as bolinhas detectadas (bom para debug visual do MVP)
            /*
            ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
            for(let d of dots) {
                ctx.beginPath();
                ctx.arc(d.cx, d.cy, 5, 0, 2*Math.PI);
                ctx.fill();
            }
            */

            // 5. Agrupar "Bolinhas" em "Padrões" (Objetos)
            let patterns = [];
            // O raio para agrupar bolinhas no mesmo padrão deve abranger a figura toda
            // Calculado proporcionalmente ao tamanho do vídeo (aprox 1/3 da tela)
            const patternClusterRadius = w * 0.35; 

            for (let i = 0; i < dots.length; i++) {
                let d = dots[i];
                let foundPattern = false;

                for (let j = 0; j < patterns.length; j++) {
                    let p = patterns[j];
                    // Checa a distância desta bolinha para o centroide do padrão atual
                    let dist = Math.hypot(d.cx - p.cx, d.cy - p.cy);
                    
                    if (dist < patternClusterRadius) {
                        p.dots.push(d);
                        // Recalcula o centroide do padrão
                        p.cx = p.dots.reduce((sum, dot) => sum + dot.cx, 0) / p.dots.length;
                        p.cy = p.dots.reduce((sum, dot) => sum + dot.cy, 0) / p.dots.length;
                        
                        p.minX = Math.min(p.minX, d.minX);
                        p.maxX = Math.max(p.maxX, d.maxX);
                        p.minY = Math.min(p.minY, d.minY);
                        p.maxY = Math.max(p.maxY, d.maxY);
                        
                        foundPattern = true;
                        break;
                    }
                }

                if (!foundPattern) {
                    patterns.push({
                        dots: [d],
                        cx: d.cx, cy: d.cy,
                        minX: d.minX, maxX: d.maxX, minY: d.minY, maxY: d.maxY
                    });
                }
            }

            // 6. Analisar Padrões encontrados e renderizar UI
            let foundObjectsThisFrame = [];

            for (let p of patterns) {
                let dotCount = p.dots.length;
                let objectInfo = objectDictionary[dotCount];

                if (objectInfo) {
                    foundObjectsThisFrame.push(objectInfo);

                    // Margem para a caixa envolvente
                    const padding = 20;
                    const bx = p.minX - padding;
                    const by = p.minY - padding;
                    const bw = (p.maxX - p.minX) + (padding * 2);
                    const bh = (p.maxY - p.minY) + (padding * 2);

                    // Desenhar Bounding Box estilo AR
                    ctx.strokeStyle = objectInfo.color;
                    ctx.lineWidth = 4;
                    ctx.setLineDash([10, 10]); // Linha tracejada
                    ctx.strokeRect(bx, by, bw, bh);
                    ctx.setLineDash([]); // Reset

                    // Desenhar Fundo do Texto
                    ctx.fillStyle = objectInfo.color;
                    ctx.globalAlpha = 0.9;
                    
                    // Tamanho dinâmico do texto com base na resolução
                    const fontSize = Math.max(18, w * 0.04);
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    const textStr = `${objectInfo.icon} ${objectInfo.name}`;
                    const textWidth = ctx.measureText(textStr).width;
                    
                    // Caixa de texto com bordas arredondadas (simulação simples)
                    ctx.fillRect(bx, by - (fontSize + 16), textWidth + 20, fontSize + 16);
                    
                    // Desenhar Texto
                    ctx.globalAlpha = 1.0;
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(textStr, bx + 10, by - 8);
                }
            }

            // Atualiza painel inferior
            updateStatus(foundObjectsThisFrame);

            // Solicita o próximo frame
            animationId = requestAnimationFrame(processVideo);
        }

        // Event Listeners
        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        
        // Ajusta proporção no redimensionamento da janela
        window.addEventListener('resize', () => {
            if(isRunning && videoElement.videoWidth) {
                 renderCanvas.width = videoElement.videoWidth;
                 renderCanvas.height = videoElement.videoHeight;
            }
        });
    </script>
</body>
</html>
