<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khade - Encontrador de Objetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;600;900&display=swap');
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Lexend', sans-serif; touch-action: none; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { display: none; }
        #display-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .hud-text { text-shadow: 2px 2px 0 #000; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    </style>
</head>
<body class="text-white">

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="display-canvas"></canvas>
        <canvas id="processing-canvas" style="display:none;"></canvas>
        <div id="flash"></div>

        <!-- HUD Khade -->
        <div class="absolute top-0 left-0 w-full p-6 z-20 bg-gradient-to-b from-black/90 to-transparent">
            <h1 class="text-2xl font-black text-sky-400">KHADE</h1>
            <p id="status-text" class="text-sm text-gray-300">Aponte para o objeto marcado...</p>
        </div>

        <div id="capture-alert" class="absolute inset-0 flex items-center justify-center z-30 hidden">
            <div class="bg-white text-black p-8 rounded-3xl text-center shadow-2xl animate-bounce">
                <h2 id="obj-found" class="text-4xl font-black text-sky-600">CHAVE</h2>
                <p class="text-gray-500 mt-2 font-semibold">Objeto localizado com sucesso!</p>
            </div>
        </div>
    </div>

    <script>
        // Mapeamento de Padrões (Khade Engine)
        const OBJECT_MAP = {
            3: { name: "CHAVE", color: "#38bdf8" },
            4: { name: "CONTROLE REMOTO", color: "#a855f7" },
            6: { name: "CONTROLE DO PORTÃO", color: "#ec4899" }
        };

        const STATE = { isCapturing: false, stableFrames: 0 };
        const CONFIG = { processWidth: 160, processHeight: 120, framesToCapture: 10, cooldownMs: 4000 };

        const video = document.getElementById('video');
        const displayCanvas = document.getElementById('display-canvas');
        const displayCtx = displayCanvas.getContext('2d');
        const processCanvas = document.getElementById('processing-canvas');
        const processCtx = processCanvas.getContext('2d');
        const statusText = document.getElementById('status-text');

        processCanvas.width = CONFIG.processWidth;
        processCanvas.height = CONFIG.processHeight;

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.onloadedmetadata = () => { video.play(); requestAnimationFrame(gameLoop); };
        }

        function detectBlueDots(imageData) {
            const data = imageData.data;
            const dots = [];
            const thresholdDistance = 15; // Ajustado para ser mais sensível a proximidade

            for (let y = 0; y < CONFIG.processHeight; y += 2) {
                for (let x = 0; x < CONFIG.processWidth; x += 2) {
                    const i = (y * CONFIG.processWidth + x) * 4;
                    if (data[i+2] > data[i] + 30 && data[i+2] > data[i+1] + 30) {
                        let added = false;
                        for (let dot of dots) {
                            if (Math.hypot((dot.sumX/dot.count) - x, (dot.sumY/dot.count) - y) < thresholdDistance) {
                                dot.sumX += x; dot.sumY += y; dot.count++; added = true; break;
                            }
                        }
                        if (!added) dots.push({ sumX: x, sumY: y, count: 1 });
                    }
                }
            }
            return dots.filter(d => d.count > 3).map(d => ({x: d.sumX/d.count, y: d.sumY/d.count}));
        }

        function gameLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                displayCtx.drawImage(video, 0, 0, displayCanvas.width, displayCanvas.height);
                processCtx.drawImage(video, 0, 0, CONFIG.processWidth, CONFIG.processHeight);
                const dots = detectBlueDots(processCtx.getImageData(0, 0, CONFIG.processWidth, CONFIG.processHeight));
                
                const maxGroupDistance = 50; // Precisão reduzida para proximidade
                let groups = [];
                dots.forEach(dot => {
                    let added = false;
                    for (let g of groups) {
                        if (g.some(gd => Math.hypot(gd.x - dot.x, gd.y - dot.y) < maxGroupDistance)) {
                            g.push(dot); added = true; break;
                        }
                    }
                    if (!added) groups.push([dot]);
                });

                const pattern = groups.find(g => OBJECT_MAP[g.length]);
                
                if (pattern && !STATE.isCapturing) {
                    STATE.stableFrames++;
                    statusText.innerText = "Foco detectado...";
                    if (STATE.stableFrames >= CONFIG.framesToCapture) capture(pattern.length);
                } else {
                    STATE.stableFrames = 0;
                    statusText.innerText = "Aponte para o objeto...";
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function capture(type) {
            STATE.isCapturing = true;
            document.getElementById('flash').style.opacity = '1';
            document.getElementById('capture-alert').classList.remove('hidden');
            document.getElementById('obj-found').innerText = OBJECT_MAP[type].name;
            
            if (navigator.vibrate) navigator.vibrate(500);
            
            setTimeout(() => {
                document.getElementById('flash').style.opacity = '0';
                document.getElementById('capture-alert').classList.add('hidden');
                STATE.isCapturing = false;
            }, CONFIG.cooldownMs);
        }

        startCamera();
    </script>
</body>
</html>
