<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoHunter AR</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container do vídeo e canvas para manter a proporção da câmera */
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }

        /* Interface HUD (Heads Up Display) sobreposta */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Deixa os cliques passarem para os botões específicos */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Botão de Captura com pulso animado quando habilitado */
        .btn-capture {
            pointer-events: auto;
            transition: all 0.3s ease;
        }
        
        .btn-capture.ready {
            background-color: #10b981; /* bg-emerald-500 */
            box-shadow: 0 0 20px #10b981;
            transform: scale(1.1);
            animation: pulse-green 1.5s infinite;
        }

        .btn-capture.disabled {
            background-color: #6b7280; /* bg-gray-500 */
            opacity: 0.7;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Tela de loading imersiva */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loader-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Animação de sucesso na captura */
        #flash {
            position: absolute;
            top:0; left:0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento (OpenCV é um pouco pesado) -->
    <div id="loading-screen">
        <div class="loader-spinner mb-4"></div>
        <h1 class="text-3xl font-bold mb-2 tracking-wider">GeoHunter AR</h1>
        <p class="text-sky-300 text-sm">Carregando IA Visual e Câmera...</p>
        <p class="text-xs text-gray-400 mt-8 max-w-xs text-center">Permita o acesso à câmera quando solicitado para começar a caçada.</p>
    </div>

    <!-- Container da Câmera e Canvas AR -->
    <div id="camera-container">
        <!-- O vídeo fica oculto visualmente, serve apenas como fonte de dados -->
        <video id="videoElement" autoplay playsinline></video>
        <!-- O canvas é onde desenhamos o frame do vídeo + os gráficos AR -->
        <canvas id="canvasOutput"></canvas>
    </div>

    <!-- Efeito visual de captura -->
    <div id="flash"></div>

    <!-- HUD do Jogo -->
    <div id="hud" class="hidden">
        <!-- Barra Superior: Missão e Score -->
        <div class="flex justify-between items-start">
            <!-- Seletor de Missão (Alvo) -->
            <div class="bg-slate-900/80 backdrop-blur-md text-white p-2 rounded-2xl border border-slate-700 shadow-lg pointer-events-auto">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1 text-center">Escolher Alvo</p>
                <div class="flex items-center gap-2">
                    <button id="btn-triangle" onclick="selectMission('triangle')" class="mission-btn p-2 rounded-xl border-2 border-sky-400 bg-slate-700 transition-all flex justify-center items-center w-12 h-12 shadow-inner">
                        <i class="fa-solid fa-caret-up text-sky-400 text-2xl"></i>
                    </button>
                    <button id="btn-square" onclick="selectMission('square')" class="mission-btn p-2 rounded-xl border-2 border-transparent bg-slate-800 hover:bg-slate-700 transition-all flex justify-center items-center w-12 h-12">
                        <i class="fa-solid fa-square text-sky-400 text-xl"></i>
                    </button>
                    <button id="btn-circle" onclick="selectMission('circle')" class="mission-btn p-2 rounded-xl border-2 border-transparent bg-slate-800 hover:bg-slate-700 transition-all flex justify-center items-center w-12 h-12">
                        <i class="fa-solid fa-circle text-sky-400 text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="bg-slate-900/80 backdrop-blur-md text-white px-4 py-2 rounded-full border border-slate-700 shadow-lg flex items-center gap-2 pointer-events-auto">
                Alvo Localizado!
            </div>
        </div>

        <!-- Barra Inferior: Botão de Captura -->
        <div class="flex justify-center pb-6">
            <button id="capture-btn" class="btn-capture disabled w-20 h-20 rounded-full text-white flex items-center justify-center text-3xl border-4 border-white/20">
                <i class="fa-solid fa-camera"></i>
            </button>
        </div>
    </div>

    <!-- Carregando OpenCV.js de forma assíncrona -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>

    <script>
        // --- Estado do Jogo ---
        const shapes = [
            { name: "Triângulo", id: "triangle", icon: "fa-caret-up" },
            { name: "Quadrado", id: "square", icon: "fa-square" },
            { name: "Círculo", id: "circle", icon: "fa-circle" }
        ];
        
        let currentMission = null;
        let score = 0;
        let isTargetInSight = false;
        let isProcessing = false;
        
        // Elementos DOM
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const captureBtn = document.getElementById('capture-btn');
        const targetFeedback = document.getElementById('target-feedback');
        const flash = document.getElementById('flash');

        // Referências do OpenCV (serão inicializadas depois)
        let srcMat, dstMat, cap;
        const FPS = 30; // Limitar processamento para economizar bateria

        // --- Inicialização ---

        // Função chamada quando o script do OpenCV é carregado via CDN
        function onOpenCvReady() {
            // Garante que o WebAssembly interno do OpenCV esteja pronto
            cv['onRuntimeInitialized'] = () => {
                console.log('OpenCV.js is ready.');
                startCamera();
            };
        }

        async function startCamera() {
            try {
                // Solicita câmera traseira
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 640 }, // Resolução menor melhora a performance de IA mobile
                        height: { ideal: 480 } 
                    }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                // Quando o vídeo começar a tocar, inicializa os Mats do OpenCV e o loop de jogo
                video.addEventListener('loadeddata', () => {
                    initGame();
                });

            } catch (err) {
                console.error("Erro ao acessar câmera: ", err);
                alert("Erro ao acessar a câmera. Por favor, permita o acesso nas configurações do navegador para jogar.");
            }
        }

        function initGame() {
            // Ajusta o tamanho do canvas para o tamanho real do vídeo renderizado
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Inicializa matrizes do OpenCV
            srcMat = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            dstMat = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC1);
            cap = new cv.VideoCapture(video);

            // Esconde tela de loading e mostra HUD
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');

            selectMission('triangle'); // Inicia com triângulo selecionado
            
            // Inicia o loop de processamento
            isProcessing = true;
            setTimeout(processVideo, 0);
        }

        // --- Lógica do Jogo ---

        function selectMission(shapeId) {
            currentMission = shapes.find(s => s.id === shapeId);
            
            // Reseta o estilo visual de todos os botões de missão
            document.querySelectorAll('.mission-btn').forEach(btn => {
                btn.classList.remove('border-sky-400', 'bg-slate-700', 'shadow-inner');
                btn.classList.add('border-transparent', 'bg-slate-800');
            });
            
            // Destaca o botão recém selecionado
            const activeBtn = document.getElementById(`btn-${shapeId}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-transparent', 'bg-slate-800');
                activeBtn.classList.add('border-sky-400', 'bg-slate-700', 'shadow-inner');
            }
            
            // Zera o estado do botão de captura até ele achar a nova forma
            updateCaptureState(false);
        }

        function updateCaptureState(ready) {
            isTargetInSight = ready;
            if (ready) {
                captureBtn.classList.remove('disabled');
                captureBtn.classList.add('ready');
                targetFeedback.style.opacity = '1';
            } else {
                captureBtn.classList.add('disabled');
                captureBtn.classList.remove('ready');
                targetFeedback.style.opacity = '0';
            }
        }

        captureBtn.addEventListener('click', () => {
            if (isTargetInSight) {
                // Sucesso na captura
                score += 10;
                document.getElementById('score-text').innerText = score;
                
                // Efeito de Flash
                flash.style.opacity = '1';
                setTimeout(() => { flash.style.opacity = '0'; }, 100);
                
                // Na versão manual, a missão continua a mesma após a captura, 
                // apenas resetamos o estado visual do botão de captura
                updateCaptureState(false);
            }
        });

        // --- Motor de Visão Computacional ---

        function processVideo() {
            if (!isProcessing) return;

            let begin = Date.now();

            try {
                // Lê o frame atual do vídeo para a matriz de origem
                cap.read(srcMat);

                // Variável para checar se achamos a forma da missão neste frame
                let foundMissionShape = false;

                // 1. Converte para Tons de Cinza
                cv.cvtColor(srcMat, dstMat, cv.COLOR_RGBA2GRAY, 0);

                // 2. Aplica Desfoque (Blur) para reduzir ruídos da câmera mobile
                let ksize = new cv.Size(5, 5);
                cv.GaussianBlur(dstMat, dstMat, ksize, 0, 0, cv.BORDER_DEFAULT);

                // 3. Detecção de Bordas (Canny)
                cv.Canny(dstMat, dstMat, 50, 150, 3, false);

                // 4. Encontra Contornos
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(dstMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                // Prepara para desenhar no canvas (copiamos o frame original)
                cv.imshow('canvasOutput', srcMat);

                // 5. Analisa cada contorno encontrado
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);

                    // Ignora contornos muito pequenos (ruído) ou muito grandes (borda da tela)
                    if (area > 2000 && area < (canvas.width * canvas.height * 0.8)) {
                        
                        let tmp = new cv.Mat();
                        let perimeter = cv.arcLength(cnt, true);
                        
                        // Aproxima o contorno a um polígono
                        // O fator 0.04 define a precisão da aproximação geométrica
                        cv.approxPolyDP(cnt, tmp, 0.04 * perimeter, true);
                        
                        let vertices = tmp.rows;
                        let detectedShape = null;

                        // Classificação baseada no número de vértices
                        if (vertices === 3) {
                            detectedShape = "triangle";
                        } else if (vertices === 4) {
                            // Poderíamos calcular o aspect ratio para diferenciar quadrado de retângulo
                            detectedShape = "square"; 
                        } else if (vertices > 7) {
                            // Polígonos com muitos vértices se aproximam de um círculo
                            // Idealmente checaríamos a circularidade: 4*pi*area / (perimeter^2)
                            let circularity = (4 * Math.PI * area) / (perimeter * perimeter);
                            if (circularity > 0.7) {
                                detectedShape = "circle";
                            }
                        }

                        // Se identificamos uma forma válida, desenhamos o AR overlay
                        if (detectedShape) {
                            // Verifica se é a forma que estamos caçando
                            let isMissionTarget = (currentMission && currentMission.id === detectedShape);
                            if (isMissionTarget) foundMissionShape = true;

                            // Define cor: Verde para alvo correto, Vermelho/Rosa para outros
                            let color = isMissionTarget ? new cv.Scalar(16, 185, 129, 255) : new cv.Scalar(236, 72, 153, 255);
                            
                            // Desenha o contorno aproximado
                            let polyArray = new cv.MatVector();
                            polyArray.push_back(tmp);
                            cv.drawContours(srcMat, polyArray, 0, color, 3, cv.LINE_8, hierarchy, 0);
                            polyArray.delete();

                            // Calcula o centro para colocar a label
                            let rect = cv.boundingRect(cnt);
                            let point = new cv.Point(rect.x, rect.y - 10);
                            
                            // Nome em português para display
                            let displayName = shapes.find(s => s.id === detectedShape)?.name || "";
                            cv.putText(srcMat, displayName, point, cv.FONT_HERSHEY_SIMPLEX, 0.7, color, 2, cv.LINE_AA);
                        }
                        tmp.delete();
                    }
                    cnt.delete();
                }

                contours.delete(); hierarchy.delete();

                // Atualiza o frame com os desenhos no Canvas HTML
                cv.imshow('canvasOutput', srcMat);

                // Atualiza o estado da UI baseado no que vimos neste frame
                if (foundMissionShape !== isTargetInSight) {
                    updateCaptureState(foundMissionShape);
                }

            } catch (err) {
                console.error("Erro no processamento do frame: ", err);
            }

            // Agenda o próximo frame considerando o limite de FPS
            let delay = 1000/FPS - (Date.now() - begin);
            setTimeout(processVideo, delay > 0 ? delay : 0);
        }

        // Limpeza quando a página for fechada
        window.addEventListener('beforeunload', () => {
            isProcessing = false;
            if (srcMat) srcMat.delete();
            if (dstMat) dstMat.delete();
        });

    </script>
</body>
</html>
